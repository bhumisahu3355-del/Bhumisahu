<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown Timer - Feb 14th</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ffafcc, #ffc8dd, #cdb4db);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            overflow: hidden;
        }
        
        header {
            margin-bottom: 30px;
        }
        
        h1 {
            color: #ff4d6d;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .event-date {
            font-size: 1.5rem;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .countdown-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 0;
        }
        
        .countdown-box {
            background: linear-gradient(145deg, #ffafcc, #ff4d6d);
            border-radius: 15px;
            padding: 25px 15px;
            min-width: 140px;
            box-shadow: 0 8px 15px rgba(255, 77, 109, 0.3);
            transition: transform 0.3s;
        }
        
        .countdown-box:hover {
            transform: translateY(-10px);
        }
        
        .countdown-value {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            line-height: 1;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .countdown-label {
            font-size: 1.1rem;
            color: white;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .controls {
            margin: 30px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        #resetBtn {
            background-color: #ff4d6d;
            color: white;
        }
        
        #resetBtn:hover {
            background-color: #ff3355;
            transform: scale(1.05);
        }
        
        #pauseBtn {
            background-color: #4cc9f0;
            color: white;
        }
        
        #pauseBtn:hover {
            background-color: #3aa8d8;
            transform: scale(1.05);
        }
        
        #resumeBtn {
            background-color: #70e000;
            color: white;
        }
        
        #resumeBtn:hover {
            background-color: #5bc500;
            transform: scale(1.05);
        }
        
        .message {
            margin-top: 30px;
            padding: 20px;
            background-color: #ffccd5;
            border-radius: 15px;
            font-size: 1.3rem;
            color: #a4133c;
            display: none;
        }
        
        .message.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .heart {
            color: #ff4d6d;
            font-size: 1.5rem;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .countdown-box {
                min-width: 120px;
                padding: 20px 10px;
            }
            
            .countdown-value {
                font-size: 2.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .countdown-container {
                gap: 10px;
            }
            
            .countdown-box {
                min-width: 100px;
                padding: 15px 5px;
            }
            
            .countdown-value {
                font-size: 2.2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="heart">♥</span> Birthday Countdown <span class="heart">♥</span></h1>
            <p class="subtitle">Counting down to the special day of</p>
            <div class="event-date">February 14th</div>
        </header>
        
        <div class="countdown-container">
            <div class="countdown-box">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            
            <div class="countdown-box">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            
            <div class="countdown-box">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            
            <div class="countdown-box">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>
        
        <div class="controls">
            <button id="resetBtn">Reset Timer</button>
            <button id="pauseBtn">Pause Timer</button>
            <button id="resumeBtn">Resume Timer</button>
        </div>
        
        <div class="message" id="message">
            <strong>Happy Birthday! 🎉</strong> The countdown is over! Wishing you an amazing day filled with joy and happiness!
        </div>
        
        <div class="footer">
            <p>This timer will automatically update every second until February 14th arrives!</p>
        </div>
    </div>

    <script>
        // Set the target date (February 14th of the current or next year)
        const currentYear = new Date().getFullYear();
        let targetDate = new Date(currentYear, 1, 14); // Month is 0-indexed, so 1 = February
        
        // If February 14th has already passed this year, set target to next year
        if (targetDate < new Date()) {
            targetDate = new Date(currentYear + 1, 1, 14);
        }
        
        // Timer variables
        let countdownInterval;
        let isPaused = false;
        let remainingTime = 0;
        
        // DOM Elements
        const daysElement = document.getElementById('days');
        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');
        const messageElement = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        
        // Format numbers to always show 2 digits
        function formatTime(num) {
            return num < 10 ? `0${num}` : num;
        }
        
        // Update the countdown display
        function updateCountdown() {
            if (isPaused) return;
            
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;
            
            // If countdown is finished
            if (distance < 0) {
                clearInterval(countdownInterval);
                daysElement.textContent = '00';
                hoursElement.textContent = '00';
                minutesElement.textContent = '00';
                secondsElement.textContent = '00';
                messageElement.classList.add('show');
                return;
            }
            
            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // Update display
            daysElement.textContent = formatTime(days);
            hoursElement.textContent = formatTime(hours);
            minutesElement.textContent = formatTime(minutes);
            secondsElement.textContent = formatTime(seconds);
        }
        
        // Start the countdown timer
        function startCountdown() {
            clearInterval(countdownInterval);
            updateCountdown(); // Run immediately once
            countdownInterval = setInterval(updateCountdown, 1000);
        }
        
        // Pause the timer
        function pauseTimer() {
            if (!isPaused) {
                isPaused = true;
                clearInterval(countdownInterval);
                pauseBtn.disabled = true;
                resumeBtn.disabled = false;
                pauseBtn.style.opacity = "0.6";
                resumeBtn.style.opacity = "1";
            }
        }
        
        // Resume the timer
        function resumeTimer() {
            if (isPaused) {
                isPaused = false;
                startCountdown();
                pauseBtn.disabled = false;
                resumeBtn.disabled = true;
                pauseBtn.style.opacity = "1";
                resumeBtn.style.opacity = "0.6";
            }
        }
        
        // Reset the timer to original target date
        function resetTimer() {
            // Reset to the original target date
            const currentYear = new Date().getFullYear();
            targetDate = new Date(currentYear, 1, 14);
            
            // If February 14th has already passed this year, set target to next year
            if (targetDate < new Date()) {
                targetDate = new Date(currentYear + 1, 1, 14);
            }
            
            // Reset pause state
            isPaused = false;
            pauseBtn.disabled = false;
            resumeBtn.disabled = true;
            pauseBtn.style.opacity = "1";
            resumeBtn.style.opacity = "0.6";
            
            // Hide message if shown
            messageElement.classList.remove('show');
            
            // Restart countdown
            startCountdown();
        }
        
        // Event listeners for buttons
        resetBtn.addEventListener('click', resetTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resumeBtn.addEventListener('click', resumeTimer);
        
        // Initialize the countdown
        startCountdown();
        
        // Disable resume button initially since timer is running
        resumeBtn.disabled = true;
        resumeBtn.style.opacity = "0.6";
    </script>
</body>
</html>
